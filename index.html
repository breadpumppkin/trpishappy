<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>下一站 遇见美好 - 5人旅行空间</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #2d3748;
            --text-muted: #718096;
            --shadow-card: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 20px 40px rgba(255, 107, 107, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-attachment: fixed;
        }

        @keyframes colorFlowAndFlash {
            0% { background-position: 0% 50%; opacity: 0.85; filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.4)); }
            50% { background-position: 100% 50%; opacity: 1; filter: drop-shadow(0 0 20px rgba(102, 126, 234, 0.6)); }
            100% { background-position: 0% 50%; opacity: 0.85; filter: drop-shadow(0 0 10px rgba(255, 107, 107, 0.4)); }
        }

        .neon-flash-title {
            background: linear-gradient(127deg, #ff6b6b, #ff8e53, #f12711, #f5af19, #667eea, #764ba2, #ff6b6b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorFlowAndFlash 6s ease infinite;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.98);
            padding: 45px 35px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .auth-box .sub-title {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .auth-box input {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 1.3rem;
            outline: none;
            text-align: center;
            letter-spacing: 10px;
            background: #f8fafc;
            color: #1a202c;
        }

        .auth-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.35);
        }

        .error-tip {
            color: #e53e3e;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 850px;
            display: none;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 10px;
        }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }

        .trip-grid {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
        }

        .trip-card-item {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 35px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .trip-card-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 8px; height: 100%;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
        }

        .trip-card-item:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(255, 107, 107, 0.4);
        }

        .trip-info h3 { font-size: 1.6rem; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .trip-info p { color: var(--text-muted); font-size: 1rem; }

        .trip-badge {
            background: #fff5f5;
            color: #FF6B6B;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s;
        }

        .trip-card-item:hover .trip-badge {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e0;
            padding: 10px 20px;
            border-radius: 12px;
            color: #4a5568;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: #ffffff;
            color: #FF6B6B;
            border-color: #FF6B6B;
